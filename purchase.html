<div class="bento-grid4">
  <div class="bento-item4 boxT1">
   <div class="input-container">
 <h2> <label for="first-name">First Name</label> </h2>
   <input type="text" id="first-name" name="first_name" placeholder="Enter first name">
</div>
  </div>


  <div class="bento-item4 boxT2">
<div class="input-container">
 <h2> <label for="last-name">Last Name</label> </h2>
  <input type="text" id="last-name" name="last_name" placeholder="Enter last name">
</div>
  </div>


  <div class="bento-item4 boxT3">
  <div class="input-container">
 <h2> <label for="company">Company Name</label> </h2>
  <input type="text" id="company" name="company_name" placeholder="Your Company Ltd.">
</div>
  </div>


  <div class="bento-item4 boxT4">
<div class="input-container">
 <h2> <label for="user-email">Email Address</label> </h2>
  <input type="email" id="user-email" name="user_email" placeholder="example@domain.com" required>
<span class="error-msg" id="email-error">Please enter a valid email address.</span>
</div>
  </div>


    <div class="bento-item4 boxT5">
<div class="input-container">
 <h2> <label for="subject">Choose which you want to purchase</label> </h2>
  <select id="subject" name="subject">
    <option value="" disabled selected>Please select...</option>
    <option value="Sora-X1">Sora-X1 </option>
    <option value="Sora Neon">Sora-Neon</option>
  </select>
</div>
  </div>

  <div class="bento-item4 boxT6">
    <div class="input-container">
 <h2> <label for="phone" class="form-label">Phone Number</label> </h2>
  <input 
    type="tel" 
    id="phone" 
    name="phone" 
    class="input-phone" 
    placeholder="+1 (555) 000-0000"
    pattern="[0-9]{3}-[0-9]{3}-[0-9]{4}"
  >
</div>
  </div>

  <div class="bento-item4 boxT7">
<button type="submit" class="custom-submit-btn"> Purchase </button>
  </div>

</div>
